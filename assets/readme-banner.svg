<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">FocusFlow</title><desc id="d">A calm growing orb pulses at the center of a focus session.</desc><defs><linearGradient id="bg"><stop stop-color="#17253d"/><stop offset="1" stop-color="#0a111e"/></linearGradient><radialGradient id="orb"><stop stop-color="#b3fff0"/><stop offset=".55" stop-color="#62e3c1"/><stop offset="1" stop-color="#526fba"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="16"/></filter></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><circle cx="850" cy="150" r="95" fill="#62e3c1" opacity=".18" filter="url(#blur)"><animate attributeName="r" values="75;110;75" dur="4s" repeatCount="indefinite"/></circle><circle cx="850" cy="150" r="62" fill="url(#orb)"><animate attributeName="r" values="52;66;52" dur="4s" repeatCount="indefinite"/></circle><g fill="none" stroke="#8fa8ff" stroke-width="2" opacity=".6"><circle cx="850" cy="150" r="90"><animate attributeName="r" values="78;105;78" dur="4s" repeatCount="indefinite"/></circle><circle cx="850" cy="150" r="118" opacity=".5"/></g><text x="90" y="135" fill="#edf3ff" font-family="Arial,sans-serif" font-size="54" font-weight="700">FOCUSFLOW</text><text x="94" y="180" fill="#91a0ba" font-family="monospace" font-size="16" letter-spacing="4">A QUIETER WAY TO FOCUS</text><path d="M95 215H520" stroke="#62e3c1" stroke-width="3"><animate attributeName="stroke-dasharray" values="0 425;425 0" dur="4s" repeatCount="indefinite"/></path></svg>